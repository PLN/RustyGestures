[package]
name = "rustygestures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "RustyGestures mouse-gesture engine"

[[bin]]
name = "rustygestures"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rustygestures-core = { version = "0.0.0", path = "../rustygestures-core" }
rustygestures-ui = { version = "0.0.0", path = "../rustygestures-ui" }
rustygestures-win = { version = "0.0.0", path = "../rustygestures-win" }
